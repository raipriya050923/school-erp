<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="School ERP">
  <!--
    The same mark the sidebar shows: the `cap` icon on the brand gradient, drawn on a rounded
    square so it reads as an app icon rather than a floating glyph.
    Geometry matches icon.component.ts `cap`, scaled from a 24px box to this 64px one.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#brand)"/>
  <g transform="translate(8 8) scale(2)" fill="none" stroke="#fff"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 10 12 5 2 10l10 5 10-5z"/>
    <path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>
  </g>
</svg>
